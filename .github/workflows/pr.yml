name: Build ShareXO (PR)

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Release (x64)
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m "${{ env.SOLUTION_FILE_PATH }}"
