name: Build ShareXO

on:
  push:
    branches:
      - develop
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
      - "**/*.gitignore"
      - "**/*.gitattributes"

permissions:
  contents: read

jobs:
  build:
    name: Release (x64)
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      ASSEMBLY_INFO_PATH: Directory.build.props
      FFMPEG_VERSION: "8.1"
      PLATFORM: x64
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set build variables
        id: variables
        shell: pwsh
        run: |
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $match = [regex]::Match($content, '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>')
          if (-not $match.Success) {
            throw "Could not read the application version from ${{ env.ASSEMBLY_INFO_PATH }}."
          }

          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF -eq "refs/heads/develop") {
            $version = "$version.$env:GITHUB_RUN_NUMBER"
            $content = [regex]::Replace($content, '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>', "<Version>$version</Version>")
            Set-Content -Path "${{ env.ASSEMBLY_INFO_PATH }}" -Value $content -NoNewline
          }

          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "app-version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet packages
        run: dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m "${{ env.SOLUTION_FILE_PATH }}"

      - name: Download FFmpeg for packaging
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $downloadUrl = "https://github.com/ShareX/FFmpeg/releases/download/v${{ env.FFMPEG_VERSION }}/ffmpeg-${{ env.FFMPEG_VERSION }}-win-${{ env.PLATFORM }}.zip"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $ffmpegPath = Get-ChildItem -Path $extractPath -Filter "ffmpeg.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $ffmpegPath) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }
          $destinationPath = "${{ github.workspace }}\ShareX\bin\Release\${{ env.RUNTIME_ID }}\ffmpeg.exe"
          Copy-Item -LiteralPath $ffmpegPath.FullName -Destination $destinationPath -Force

      - name: Package setup and portable build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: '& "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job Release -platform "${{ env.PLATFORM }}"'

      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: Release-x64
          path: |
            Output/ShareX-${{ env.APP_VERSION }}-setup-${{ env.PLATFORM }}.exe
            Output/ShareX-${{ env.APP_VERSION }}-portable-${{ env.PLATFORM }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: Release-*
          path: Output
          merge-multiple: true

      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "Output" -File | Sort-Object Name
          $rows = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "| $($_.Name) | ``$hash`` |"
          }
          $body = "| File | SHA256 |`n| --- | --- |`n$($rows -join "`n")"
          Set-Content -Path "RELEASE_BODY.md" -Value $body -NoNewline

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          body_path: RELEASE_BODY.md
          files: Output/*
